<div class="edit-post-container p-fluid">
  <div class="loading-overlay" *ngIf="loading">
    <div class="loading-spinner">
      <img src="anim/spinnin_loading2.svg" alt="spinning loading">
    </div>
  </div>
  
  <p-confirmDialog></p-confirmDialog>
  <p-toast></p-toast>

  <div class="card">  
    <form (ngSubmit)="updatePost()" [formGroup]="editForm" *ngIf="post">
      <div class="form-grid">
        <h1 class="form-title">Editar publicación</h1>
        
        <!-- Title Input -->
        <div class="form-group">
          <label for="title" class="form-label">Título</label>
          <input 
            pInputText 
            id="title" 
            formControlName="title" 
            placeholder="Ingrese el título"
            [class]="{'p-invalid': editForm.get('title')?.invalid && editForm.get('title')?.touched}">
          <small *ngIf="editForm.get('title')?.invalid && editForm.get('title')?.touched" class="error-message">
            <i class="pi pi-exclamation-circle"></i> El título es requerido (mínimo 5 caracteres)
          </small>
        </div>

        <!-- Description Textarea -->
        <div class="form-group">
          <label for="description" class="form-label">Descripción</label>
          <textarea 
            pInputTextarea 
            id="description" 
            formControlName="description" 
            rows="5"
            placeholder="Ingrese la descripción"
            [class]="{'p-invalid': editForm.get('description')?.invalid && editForm.get('description')?.touched}">
          </textarea>
          <small *ngIf="editForm.get('description')?.invalid && editForm.get('description')?.touched" class="error-message">
            <i class="pi pi-exclamation-circle"></i> La descripción es requerida (mínimo 10 caracteres)
          </small>
        </div>

        <!-- Image Upload -->
        <div class="form-group">
          <label for="images" class="form-label">Imágenes (opcional)</label>
          <p-fileUpload 
            id="images"
            name="images" 
            [multiple]="true" 
            [accept]="'image/*'"
            [maxFileSize]="5000000"
            (onSelect)="onImageSelect($event)"
            (onRemove)="onImageRemove($event)"
            [showUploadButton]="false"
            [showCancelButton]="false"
            chooseLabel="Seleccionar imágenes"
            cancelLabel="Cancelar"
            class="custom-file-upload">
            <ng-template pTemplate="content">
              <ul *ngIf="uploadedFiles.length > 0" class="file-list">
                <li *ngFor="let file of uploadedFiles" class="file-item">
                  <i class="pi pi-file"></i> {{ file.name }} ({{ (file.size / 1024).toFixed(2) }} KB)
                </li>
              </ul>
            </ng-template>
          </p-fileUpload>
          <small class="file-hint">
            <i class="pi pi-info-circle"></i> Máximo 5MB por imagen. Formatos: JPG, PNG, JPEG
          </small>
        </div>

        <!-- Current Images Preview -->
        <div class="form-group" *ngIf="post.images.length > 0">
          <div class="images-header">
            <label class="form-label">Imágenes actuales</label>
            <button 
              pButton 
              pRipple 
              type="button" 
              label="Eliminar todas" 
              icon="pi pi-trash"
              class="p-button-danger p-button-sm delete-all-btn"
              (click)="deleteAllImages()"
              [disabled]="deleting">
              <i class="pi pi-spin pi-spinner" *ngIf="deleting"></i>
            </button>
          </div>
          <div class="current-images-grid">
            <div class="image-container" *ngFor="let image of post.images">
              <img [src]="image.url" [alt]="post.title" class="image-preview">
              <button 
                pButton 
                pRipple 
                type="button" 
                icon="pi pi-times" 
                class="p-button-rounded p-button-danger image-remove-btn"
                (click)="removeExistingImage(image.id)">
              </button>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="form-actions">
          <button 
            pButton 
            type="button" 
            label="Cancelar" 
            class="p-button-outlined p-button-secondary p_cancelar"
            [disabled]="loading"
            (click)="router.navigate(['/mis-publicaciones'])">
          </button>
          
          <button 
            pButton 
            type="submit" 
            label="Actualizar Publicación" 
            class="p-button-primary submit-btn p_aceptar"
            [disabled]="editForm.invalid || loading">
            <i class="pi pi-spin pi-spinner" *ngIf="loading"></i>
          </button>
        </div>
      </div>
    </form>

    <div *ngIf="!post && !loading" class="not-found-message">
      <i class="pi pi-exclamation-triangle"></i>
      <p>No se encontró la publicación</p>
    </div>
  </div>
</div>
