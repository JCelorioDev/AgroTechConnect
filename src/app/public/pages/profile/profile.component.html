<div class="perfil-container">
    <div class="perfil-banner">
      <div class="perfil-avatar">
        <img [src]="objUser?.image?.url ? objUser?.image?.url  : 'img/user/perfil1.png'" alt="Avatar" />
      </div>
    </div>
  
    <div class="perfil-contenido">
      <p-tag severity="success" [value]="range?.name" class="perfil-estado"></p-tag>
      <h2 class="perfil-nombre">
        {{objUser?.name + ' ' + objUser?.lastname}} <i class="pi pi-star-fill perfil-estrella"></i>
      </h2>
      <p class="perfil-rol">{{'@' + objUser?.username}}</p>
  
      <div class="perfil-metricas">
        <div><i class="pi pi-thumbs-up"></i><span>{{objUser?.reactions?.length}}</span></div>
        <div><i class="pi pi-comments"></i><span>{{objUser?.posts?.length}}</span></div>
        <div><i class="pi pi-users"></i><span>{{objUser?.followers?.length}}</span></div>
      </div>
  
      <p-panel class="perfil-sobremi" header="Sobre mí">
        <p>
          {{objUser?.user_information?.description}}
        </p>
      </p-panel>
  
      <div class="perfil-social">
        <i class="pi pi-linkedin"> DroneCropXpert</i> 
        <i class="pi pi-youtube"> DroneCropXpert</i> 
      </div>
    </div>
</div>
