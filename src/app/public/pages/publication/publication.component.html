<div class="publication-container">
    <div class="loading-spinner" *ngIf="loading">
      <img src="anim/spinnin_loading2.svg" alt="spinning loading" >
    </div>
  
    <div *ngIf="error && !loading" class="error-message">
      <p>{{ error }}</p>
      <p-button label="Reintentar" icon="pi pi-refresh" (click)="getsPost()"></p-button>
    </div>
  
    <div *ngIf="!loading && !error" class="posts-grid">
      <div *ngFor="let post of listPost" class="post-card">
        <p-card [header]="post.title" [subheader]="post.user.name + ' ' + post.user.lastname">
          <ng-template pTemplate="header">
            <img *ngIf="post.images.length > 0" [src]="post.images[0].url" [alt]="post.title" class="post-image">
          </ng-template>
          
          <p class="post-description">{{ post.description }}</p>
          
          <div class="post-meta">
            <span class="post-date">
              <i class="pi pi-calendar"></i> {{ post.created_at | date:'mediumDate' }}
            </span>
            <span class="post-comments">
              <i class="pi pi-comments"></i> {{ post.comments_count }} comentarios
            </span>
          </div>
          
          <div class="post-reactions">
            <span class="positive-reactions">
              <i class="pi pi-thumbs-up"></i> {{ post.positive_reactions_count }}
            </span>
            <span class="negative-reactions">
              <i class="pi pi-thumbs-down"></i> {{ post.negative_reactions_count }}
            </span>
          </div>
          
          <ng-template pTemplate="footer">
            <div class="user-info">
              <p-avatar [image]="post.user.image.url" [shape]="'circle'" size="normal"></p-avatar>
              <span class="username">{{ post.user.username }}</span>
              <p-tag [value]="post.user.ranges[0]?.name" 
                     [severity]="getRangeSeverity(post.user.ranges[0]?.name)" 
                     styleClass="user-range"></p-tag>
            </div>
            <p-button label="Leer más" icon="pi pi-book" styleClass="p-button-outlined p-button-sm"></p-button>
          </ng-template>
        </p-card>
      </div>
    </div>
  </div>
